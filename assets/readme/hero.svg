<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Perfil Académico Interactivo</title>
  <desc id="d">Formulario con campos de DNI y nota, una tabla de asignaturas y diez muestras de color que representan los estilos por último dígito del DNI.</desc>
  <style>
    :root { --bg:#f4f7fb; --card:#ffffff; --ink:#0f2540; --title:#14396b; --line:#d3dce8; --muted:#5a6b82; --accent:#1f5aa8; --band:#0f2540; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1520; --card:#16212f; --ink:#e8eef7; --title:#8fb7ee; --line:#2c3b50; --muted:#93a4ba; --accent:#5b8fd0; --band:#0a111a; }
    }
    text { font-family: Calibri, Carlito, "Segoe UI", sans-serif; fill: var(--ink); }
    .h1 { font-size: 52px; font-weight: 700; fill: var(--title); }
    .sub { font-size: 24px; fill: var(--muted); }
    .lbl { font-size: 18px; fill: var(--muted); }
    .val { font-size: 22px; font-weight: 600; }
    .th { font-size: 18px; font-weight: 700; fill: #fff; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 20px; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="1200" height="380" fill="var(--bg)"/>
  <rect width="1200" height="12" fill="var(--band)"/>
  <rect y="12" width="1200" height="4" fill="var(--accent)"/>

  <text class="h1" x="60" y="110">Perfil Académico</text>
  <text class="h1" x="60" y="170">Interactivo</text>
  <text class="sub" x="60" y="222">Carga tus datos y asignaturas, y obtené</text>
  <text class="sub" x="60" y="254">tu perfil, cálculos y estadísticas.</text>
  <text class="mono" x="60" y="320" style="fill:var(--accent)">HTML · CSS · JavaScript</text>
  <rect class="cur" x="320" y="302" width="11" height="24" fill="var(--accent)"/>

  <!-- tarjeta formulario + tabla -->
  <rect x="640" y="48" width="500" height="290" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text class="lbl" x="664" y="84">DNI</text>
  <rect x="664" y="94" width="200" height="38" rx="5" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text class="mono" x="676" y="120">12345678</text>
  <text class="lbl" x="884" y="84">Nota</text>
  <rect x="884" y="94" width="100" height="38" rx="5" fill="none" stroke="var(--line)" stroke-width="2"/>
  <text class="mono" x="896" y="120">8,5</text>
  <rect x="1000" y="94" width="116" height="38" rx="5" fill="var(--accent)"/>
  <text class="lbl" x="1014" y="120" style="fill:#fff">Agregar</text>

  <rect x="664" y="152" width="452" height="34" fill="var(--title)"/>
  <text class="th" x="676" y="175">Asignatura</text>
  <text class="th" x="900" y="175">Año</text>
  <text class="th" x="1010" y="175">Nota</text>
  <g class="val">
    <text x="676" y="214">Programación I</text><text x="900" y="214">2025</text><text x="1010" y="214">9</text>
    <text x="676" y="246">Matemática</text><text x="900" y="246">2025</text><text x="1010" y="246">8</text>
  </g>
  <line x1="664" y1="256" x2="1116" y2="256" stroke="var(--line)" stroke-width="2"/>

  <!-- 10 estilos por último dígito -->
  <g>
    <rect x="664" y="276" width="38" height="38" rx="5" fill="#0f2540"/>
    <rect x="708" y="276" width="38" height="38" rx="5" fill="#222"/>
    <rect x="752" y="276" width="38" height="38" rx="5" fill="#2e7d32"/>
    <rect x="796" y="276" width="38" height="38" rx="5" fill="#8d6e63"/>
    <rect x="840" y="276" width="38" height="38" rx="5" fill="#1976d2"/>
    <rect x="884" y="276" width="38" height="38" rx="5" fill="#ffb300"/>
    <rect x="928" y="276" width="38" height="38" rx="5" fill="#ef6c00"/>
    <rect x="972" y="276" width="38" height="38" rx="5" fill="#7e57c2"/>
    <rect x="1016" y="276" width="38" height="38" rx="5" fill="#9e9e9e"/>
    <rect x="1060" y="276" width="38" height="38" rx="5" fill="#6a1b9a"/>
  </g>
</svg>
